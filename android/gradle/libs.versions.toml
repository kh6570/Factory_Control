# In the name of God, the Most Gracious, the Most Merciful
[versions]
agp = "9.4.1"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
activityCompose = "1.13.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
ksp = "2.3.12"
hilt = "2.60.1"
androidxHilt = "1.4.0"
room = "2.8.5"
media3 = "1.11.1"
navigation = "2.10.2"
lifecycle = "2.11.0"
coroutines = "1.11.0"
serialization = "1.11.0"
turbine = "1.2.1"
javaxInject = "1"
materialIcons = "1.7.8"
biometric = "1.1.0"
fragment = "1.9.1"
datastore = "1.2.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
